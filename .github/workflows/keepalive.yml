name: Tieni sveglio Supabase

# Il piano gratuito di Supabase mette in pausa il progetto dopo una settimana senza richieste.
# Questa chiamata parte due volte a settimana (lunedì e giovedì). Se fallisce, GitHub manda una mail.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiamata al database
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Mancano i secret VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"; exit 1; fi
          codice=$(curl -sS -m 30 -o /tmp/risposta -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Risposta $codice: $(cat /tmp/risposta)"
          if [ "$codice" != "200" ]; then exit 1; fi
